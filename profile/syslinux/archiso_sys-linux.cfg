LABEL arch
TEXT HELP
Inicia o Obelisk (BIOS).
Desktop ao vivo e instalador.
ENDTEXT
MENU LABEL Obelisk (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Inicia o Obelisk (BIOS).with speakup screen reader.
Desktop ao vivo e instalador.with speech feedback.
ENDTEXT
MENU LABEL Obelisk (%ARCH%, BIOS) com ^fala
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
