[package]
name = "obelisk-comp"
description = "Obelisk: compositor Wayland e shell (barra de menus, dock, launcher) em Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "obelisk-compositor"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
resvg = "0.50"
fontdue = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bitflags = "2"
libc = "0.2"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
xcursor = "0.3"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
zbus = "5"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
]
